name: Runner storage tests

on:
  pull_request:
    paths:
      - tools/windows-build/**
      - .github/workflows/runner-storage-tests.yml
  push:
    branches: [master]
    paths:
      - tools/windows-build/**
      - .github/workflows/runner-storage-tests.yml

permissions:
  contents: read

jobs:
  storage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run archive retention and dependency patch regressions
        run: python3 -m unittest discover -s tools/windows-build -p 'test_*.py'
